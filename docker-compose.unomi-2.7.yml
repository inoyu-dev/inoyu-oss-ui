# Docker Compose for Apache Unomi 2.7.0 + Elasticsearch 7.17 (Unomi < 3.1).
#
#   docker compose -f docker-compose.unomi-2.7.yml up -d
#
# Point the UI at this stack with:
#   UNOMI_VERSION=2.7
#   UNOMI_URL=http://localhost:8181

name: inoyu-oss-unomi-2-7
services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.24
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - cluster.name=contextElasticSearch
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 40s

  unomi:
    image: apache/unomi:2.7.0
    ports:
      - "8181:8181"
      - "9443:9443"
      - "8102:8102"
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      - UNOMI_ELASTICSEARCH_ADDRESSES=elasticsearch:9200
      - UNOMI_ELASTICSEARCH_CLUSTER_NAME=contextElasticSearch
      - UNOMI_THIRDPARTY_PROVIDER1_IPADDRESSES=0.0.0.0/0,::1,127.0.0.1,192.168.0.0/16
