name: E2E Tests

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-unomi:
    uses: ./.github/workflows/build-unomi-snapshot.yml

  e2e-unomi-31:
    name: e2e Unomi ≥ 4.0 (${{ matrix.browser }})
    needs: build-unomi
    runs-on: ubuntu-latest
    timeout-minutes: 120

    strategy:
      fail-fast: false
      matrix:
        browser: [chromium]

    services:
      opensearch:
        image: opensearchproject/opensearch:3.7.0
        ports:
          - 9200:9200
        env:
          discovery.type: single-node
          OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
          OPENSEARCH_INITIAL_ADMIN_PASSWORD: Unomi.1ntegrat10n.Tests
        options: >-
          --health-cmd "curl -k -sf -u admin:Unomi.1ntegrat10n.Tests https://localhost:9200/_cluster/health || exit 1"
          --health-interval 30s
          --health-timeout 15s
          --health-retries 20
          --health-start-period 90s

    steps:
      - uses: actions/checkout@v5

      - name: Download Unomi image
        uses: actions/download-artifact@v5
        with:
          name: unomi-docker-image
          path: .

      - name: Start Unomi against OpenSearch
        env:
          OPENSEARCH_PASSWORD: Unomi.1ntegrat10n.Tests
        run: bash .github/scripts/start-unomi-opensearch.sh ./unomi-image.tar.gz

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('./node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browser
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Cache Next.js
        uses: actions/cache@v5
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            next-${{ runner.os }}-

      - name: Build application
        run: npm run build
        env:
          JWT_SECRET: test-secret
          ADMIN_EMAIL: admin@inoyu.local
          ADMIN_PASSWORD: admin
          UNOMI_VERSION: "4.0"
          UNOMI_URL: http://localhost:8181
          UNOMI_USER: karaf
          UNOMI_PASSWORD: karaf
          DEPLOYMENT_TYPE: on-premise

      - name: Run E2E tests
        run: npx playwright test --config playwright.config.ts --project=${{ matrix.browser }} --workers=2 --retries=1
        env:
          JWT_SECRET: test-secret
          ADMIN_EMAIL: admin@inoyu.local
          ADMIN_PASSWORD: admin
          UNOMI_VERSION: "4.0"
          UNOMI_URL: http://localhost:8181
          UNOMI_USER: karaf
          UNOMI_PASSWORD: karaf
          DEPLOYMENT_TYPE: on-premise
          CI: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-unomi31-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 30

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-failures-unomi31-${{ matrix.browser }}
          path: test-results/
          retention-days: 7

  e2e-unomi-27:
    name: e2e Unomi < 4.0 (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 120

    strategy:
      fail-fast: false
      matrix:
        browser: [chromium]

    services:
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:7.17.24
        ports:
          - 9200:9200
        env:
          discovery.type: single-node
          cluster.name: contextElasticSearch
          xpack.security.enabled: "false"
          ES_JAVA_OPTS: -Xms512m -Xmx512m
        options: >-
          --health-cmd "curl -sf http://localhost:9200/_cluster/health || exit 1"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 20
          --health-start-period 40s

    steps:
      - uses: actions/checkout@v5

      - name: Start Unomi 2.7 against Elasticsearch
        run: bash .github/scripts/start-unomi-elasticsearch.sh

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('./node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browser
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Cache Next.js
        uses: actions/cache@v5
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            next-${{ runner.os }}-

      - name: Build application
        run: npm run build
        env:
          JWT_SECRET: test-secret
          ADMIN_EMAIL: admin@inoyu.local
          ADMIN_PASSWORD: admin
          UNOMI_VERSION: "2.7"
          UNOMI_URL: http://localhost:8181
          UNOMI_USER: karaf
          UNOMI_PASSWORD: karaf
          DEPLOYMENT_TYPE: on-premise

      - name: Run E2E tests
        run: npx playwright test --config playwright.config.ts --project=${{ matrix.browser }} --workers=2 --retries=1
        env:
          JWT_SECRET: test-secret
          ADMIN_EMAIL: admin@inoyu.local
          ADMIN_PASSWORD: admin
          UNOMI_VERSION: "2.7"
          UNOMI_URL: http://localhost:8181
          UNOMI_USER: karaf
          UNOMI_PASSWORD: karaf
          DEPLOYMENT_TYPE: on-premise
          CI: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-unomi27-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 30

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-failures-unomi27-${{ matrix.browser }}
          path: test-results/
          retention-days: 7

  e2e-tests-summary:
    runs-on: ubuntu-latest
    needs: [e2e-unomi-31, e2e-unomi-27]
    if: always()
    steps:
      - name: Check e2e results
        run: |
          if [ "${{ needs.e2e-unomi-31.result }}" != "success" ] || [ "${{ needs.e2e-unomi-27.result }}" != "success" ]; then
            echo "One or more e2e jobs failed"
            exit 1
          fi
